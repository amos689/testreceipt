# M2: the 95 cases where a pull request description claims passing tests and CI failed a test step
# or job at the head commit (evals/results/sheet-m2.md). Two independent judges
# (evals/results/judge1-m2.md, judge2-m2.md) agreed on 84. Resolutions of the other 11:
[m2_resolved]
5 = "not-tests"        # AppVeyor PR status errored; the branch build and CircleCI test jobs passed
9 = "contradiction"    # agent ticked "passes all unit tests on make test-unit"; the unit test job failed
15 = "not-a-claim"     # backport PR body is another PR's copied commit log
24 = "not-a-claim"     # says cargo test was run on one crate, with no result
29 = "not-a-claim"     # sample output in a docs-only PR
41 = "out-of-scope"    # ticked "screenshot of my new test passing": covers the new test only
45 = "out-of-scope"    # same template box
69 = "out-of-scope"    # same template box
70 = "contradiction"   # ticked "Tests passing (make test-community)"; the test job failed
78 = "out-of-scope"    # "340+ tests" are the mouse tests; the failing job runs the whole suite
88 = "contradiction"   # ticked "New and existing unit tests pass locally"; the test job failed
# Final: 42 contradiction, 34 out-of-scope, 10 not-a-claim, 1 not-tests, 8 unclear.

